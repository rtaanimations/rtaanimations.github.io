<h1>Recommended Gear</h1>
<p class="small">Below are Amazon affiliate links. <em>As an Amazon Associate I earn from qualifying purchases.</em></p>
<hr/>
<section class="grid grid-3" id="gearGrid"></section>
<script>
  const data = [
    {"title":"Quiet Mechanical Keyboard","img":"/assets/placeholder.png","href":"https://www.amazon.com/dp/B000003","blurb":"Tactile, damped, low profile."},
    {"title":"Art Pen Display","img":"/assets/placeholder.png","href":"https://www.amazon.com/dp/B000004","blurb":"Color-accurate and reliable."},
    {"title":"LED Soft Panel","img":"/assets/placeholder.png","href":"https://www.amazon.com/dp/B000005","blurb":"Diffused, flicker-free light."}
  ];
  const grid = document.getElementById('gearGrid');
  data.forEach(item => {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <figure><img src="${item.img}" alt="${item.title}"/></figure>
      <h3>${item.title}</h3>
      <p>${item.blurb}</p>
      <p><a data-affiliate="true" href="${item.href}">Amazon link</a></p>
    `;
    grid.appendChild(card);
  });
</script>
